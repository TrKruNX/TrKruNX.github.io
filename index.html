<!DOCTYPE html>
<!-- // will display the text -->
<html lang="en">    <!-- tells the site what language it will use -->
<head>
    <meta charset="UTF-8" />    <!-- this allows the website to display special symbols -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project-Desert_Remediation</title>   <!-- displayed at brower tabs -->

    <style>
        body {
            background-color: dimgrey;
        }

        /* Centers the carousel on the screen */
        .carousel-container {
            position: relative;
            max-width: 600px;
            margin: auto;
            overflow: hidden;
            border-radius: 8px;
        }

        /* Sets a fixed size for the images */
        .carousel-slides img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: none; /* Hides all images by default */
        }

            /* Shows only the active image */
            .carousel-slides img.active {
                display: block;
            }

        /* Style for both navigation buttons */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            font-size: 24px;
            padding: 12px 16px;
            cursor: pointer;
            border-radius: 50%;
        }

            .nav-btn:hover {
                background-color: rgba(0, 0, 0, 0.8);
            }

        /* Positions the left button on the left edge */
        .left-btn {
            left: 10px;
        }

        /* Positions the right button on the right edge */
        .right-btn {
            right: 10px;
        }
    </style>

</head>
<body>  <!-- This is the area where all content is places, links, text, videos, pictures -->
    <h1> Project Desert Remediation </h1>
    - Is a game about turning the desert in to a rain forest.

                <img src="./Pictures/Salt-bad.png" alt="Salt-bad.pngg" style="max-width: 75%; height: auto;">
            </a>
        </p>

    </div>

    

</body>
</html>
